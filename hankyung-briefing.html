<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한경 브리핑</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f0e8;
    --paper: #faf7f2;
    --ink: #1a1610;
    --accent: #b5341a;
    --accent-light: #e8d5cf;
    --muted: #7a7062;
    --line: #d4cdbf;
    --card: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    padding: 0 0 60px;
  }

  /* HEADER */
  header {
    background: var(--ink);
    color: var(--bg);
    padding: 28px 32px 24px;
    position: relative;
    overflow: hidden;
  }

  header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent);
  }

  .header-top {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .masthead {
    font-family: 'Noto Serif KR', serif;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1;
  }

  .masthead span {
    color: var(--accent);
  }

  .date-badge {
    font-size: 12px;
    font-weight: 300;
    color: #a09888;
    letter-spacing: 0.5px;
  }

  .tagline {
    margin-top: 8px;
    font-size: 11px;
    color: #706858;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* MAIN */
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px 0;
  }

  /* BRIEFING BUTTON */
  .briefing-wrap {
    text-align: center;
    margin-bottom: 32px;
  }

  .btn-briefing {
    background: var(--accent);
    color: white;
    border: none;
    padding: 16px 40px;
    font-family: 'Noto Serif KR', serif;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.5px;
    border-radius: 2px;
    transition: all 0.2s;
    box-shadow: 3px 3px 0 rgba(181,52,26,0.25);
    position: relative;
    overflow: hidden;
  }

  .btn-briefing:hover {
    transform: translateY(-1px);
    box-shadow: 4px 5px 0 rgba(181,52,26,0.3);
  }

  .btn-briefing:active { transform: translateY(0); }

  .btn-briefing:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  .btn-sub {
    display: block;
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
  }

  /* LOADING */
  .loading {
    display: none;
    text-align: center;
    padding: 48px 0;
  }

  .loading.show { display: block; }

  .spinner {
    display: inline-block;
    width: 32px;
    height: 32px;
    border: 2px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    font-size: 13px;
    color: var(--muted);
    font-weight: 300;
  }

  /* RESULT */
  #result {
    display: none;
  }

  #result.show { display: block; }

  .section-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 500;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }

  /* NEWS CARDS */
  .news-list {
    display: flex;
    flex-direction: column;
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    margin-bottom: 24px;
  }

  .news-item {
    background: var(--paper);
    padding: 20px 22px;
    animation: fadeUp 0.4s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .news-item:nth-child(1) { animation-delay: 0.05s; }
  .news-item:nth-child(2) { animation-delay: 0.1s; }
  .news-item:nth-child(3) { animation-delay: 0.15s; }
  .news-item:nth-child(4) { animation-delay: 0.2s; }
  .news-item:nth-child(5) { animation-delay: 0.25s; }

  .news-num {
    font-size: 10px;
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 1px;
    margin-bottom: 6px;
    display: block;
  }

  .news-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.5;
    margin-bottom: 8px;
    color: var(--ink);
  }

  .news-body {
    font-size: 13px;
    line-height: 1.8;
    color: #4a4438;
    font-weight: 300;
  }

  .news-tag {
    display: inline-block;
    margin-top: 10px;
    font-size: 10px;
    padding: 2px 8px;
    background: var(--accent-light);
    color: var(--accent);
    border-radius: 1px;
    font-weight: 500;
    letter-spacing: 0.5px;
  }

  /* SUMMARY BOX */
  .summary-box {
    background: var(--ink);
    color: var(--bg);
    padding: 22px 24px;
    margin-bottom: 24px;
    animation: fadeUp 0.4s ease 0.3s both;
  }

  .summary-box .section-label {
    color: var(--accent);
    border-bottom-color: #3a342a;
  }

  .summary-text {
    font-size: 13px;
    line-height: 1.9;
    color: #c8bfb0;
    font-weight: 300;
  }

  /* TIMESTAMP */
  .timestamp {
    text-align: right;
    font-size: 11px;
    color: var(--muted);
    margin-top: 8px;
    font-weight: 300;
  }

  /* ERROR */
  .error-box {
    background: #fff5f3;
    border: 1px solid #f5c4bb;
    padding: 20px;
    border-radius: 2px;
    font-size: 13px;
    color: var(--accent);
    display: none;
  }

  .error-box.show { display: block; }

  /* DIVIDER */
  .divider {
    text-align: center;
    color: var(--line);
    letter-spacing: 8px;
    font-size: 12px;
    margin: 28px 0;
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div>
      <div class="masthead">한경<span>브리핑</span></div>
      <div class="tagline">Hankyung AI Daily Briefing</div>
    </div>
    <div class="date-badge" id="headerDate"></div>
  </div>
</header>

<main>
  <div class="briefing-wrap">
    <button class="btn-briefing" id="briefBtn" onclick="fetchBriefing()">
      📰 오늘의 한경 브리핑 받기
    </button>
    <span class="btn-sub">버튼을 누르면 AI가 오늘의 주요 뉴스를 정리해드려요</span>
  </div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div class="loading-text">한국경제신문 최신 뉴스를 분석하고 있어요...</div>
  </div>

  <div class="error-box" id="errorBox"></div>

  <div id="result">
    <div class="section-label">오늘의 핵심 뉴스</div>
    <div class="news-list" id="newsList"></div>

    <div class="summary-box">
      <div class="section-label">오늘의 한줄 총평</div>
      <div class="summary-text" id="summaryText"></div>
    </div>

    <div class="timestamp" id="timestamp"></div>
  </div>
</main>

<script>
  // 날짜 표시
  const now = new Date();
  const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
  document.getElementById('headerDate').textContent = now.toLocaleDateString('ko-KR', options);

  async function fetchBriefing() {
    const btn = document.getElementById('briefBtn');
    const loading = document.getElementById('loading');
    const result = document.getElementById('result');
    const errorBox = document.getElementById('errorBox');

    btn.disabled = true;
    loading.classList.add('show');
    result.classList.remove('show');
    errorBox.classList.remove('show');

    const today = now.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });

    const prompt = `오늘(${today}) 한국경제신문의 주요 뉴스를 웹에서 검색해서 브리핑해줘.

반드시 JSON 형식으로만 응답해. 다른 텍스트나 마크다운 백틱 없이 순수 JSON만.

형식:
{
  "news": [
    {
      "num": "01",
      "tag": "카테고리(예: 금융/부동산/증권/경제/산업/정치)",
      "title": "뉴스 제목 (간결하게)",
      "body": "2-3문장으로 핵심만 쉽게 설명. 어려운 경제 용어는 풀어서."
    }
  ],
  "summary": "오늘 뉴스 전체를 관통하는 한줄 총평. 오늘 경제 흐름의 핵심 키워드와 분위기를 담아서."
}

뉴스는 5개, 정치/경제/부동산/증권/산업 골고루. 중학생도 이해할 수 있게 쉽게 써줘.`;

    try {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1000,
          tools: [{ type: "web_search_20250305", name: "web_search" }],
          messages: [{ role: "user", content: prompt }]
        })
      });

      if (!response.ok) throw new Error(`API 오류: ${response.status}`);

      const data = await response.json();

      // 텍스트 블록 추출
      const textBlock = data.content.find(b => b.type === "text");
      if (!textBlock) throw new Error("응답 없음");

      let raw = textBlock.text.trim();
      // JSON 펜스 제거
      raw = raw.replace(/```json|```/g, '').trim();

      const parsed = JSON.parse(raw);
      renderBriefing(parsed);

    } catch (err) {
      errorBox.textContent = `뉴스를 불러오지 못했어요. 잠시 후 다시 시도해줘! (${err.message})`;
      errorBox.classList.add('show');
    } finally {
      btn.disabled = false;
      loading.classList.remove('show');
    }
  }

  function renderBriefing(data) {
    const list = document.getElementById('newsList');
    list.innerHTML = '';

    data.news.forEach((item, i) => {
      const el = document.createElement('div');
      el.className = 'news-item';
      el.style.animationDelay = `${i * 0.06}s`;
      el.innerHTML = `
        <span class="news-num">${item.num || String(i+1).padStart(2,'0')}</span>
        <div class="news-title">${item.title}</div>
        <div class="news-body">${item.body}</div>
        <span class="news-tag">${item.tag}</span>
      `;
      list.appendChild(el);
    });

    document.getElementById('summaryText').textContent = data.summary;

    const ts = new Date();
    document.getElementById('timestamp').textContent =
      `${ts.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })} 기준 AI 브리핑`;

    document.getElementById('result').classList.add('show');
    document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
</script>
</body>
</html>
